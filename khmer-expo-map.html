:root{--ink:#24324a;--muted:#6a7893;--red:#ff4d4d;--card:#fffdf7f4;--line:#e3e8f2}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#cfe8ff;color:var(--ink);font:15px/1.5 "MiSans Khmer","Noto Sans Khmer","Khmer OS Battambang","Segoe UI","Trebuchet MS",system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}#map{position:absolute;inset:0}
.top{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;background:var(--card);border-radius:999px;padding:4px;box-shadow:0 6px 20px #2a3f6a30;z-index:2}
.top button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:700;font-size:13px}.top button.on{background:var(--red);color:#fff}
.panel{position:absolute;left:18px;top:18px;width:350px;max-height:calc(100% - 36px);overflow:auto;background:var(--card);border-radius:22px;padding:18px;box-shadow:0 16px 40px #2a3f6a38;z-index:1}
h1{font:700 22px/1.35 "MiSans Khmer","Noto Sans Khmer","Khmer OS Battambang","Segoe UI","Trebuchet MS",system-ui,sans-serif;margin:0 0 4px}.sub{margin:0 0 12px;color:var(--muted);font-size:13px}
.turn{display:flex;gap:12px;align-items:center;padding:12px;border-radius:18px;background:#fff1c9;border:2px solid #ffe08a}
.turn svg{width:46px;height:46px;flex:none;background:#fff;border-radius:50%;padding:9px;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.d{font-size:13px;font-weight:800;color:#d2691e}.turn h2{font-size:18px;line-height:1.2;margin:2px 0;font-weight:800}.st{font-size:13px;color:var(--muted)}
.prog{margin:12px 0 4px;height:8px;background:var(--line);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--red);border-radius:8px}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted)}.meta b{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:12px}.btn{flex:1;border:2px solid var(--line);background:#fff;padding:10px;border-radius:14px;font-weight:700}
.btn#fit{font-size:11px;line-height:1.15;padding:9px 7px;letter-spacing:.01em;flex:0.78;white-space:normal}
.btn.p{flex:1.6;background:var(--red);border-color:var(--red);color:#fff}.btn:disabled{opacity:.5}.btn:focus-visible,.top button:focus-visible{outline:3px solid #2f7bff88;outline-offset:2px}
.halls{margin-top:14px}.halls h3{font-size:13px;margin:0 0 8px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.chip{border:2px solid var(--c);background:#fff;border-radius:12px;padding:8px 4px;font-weight:800;font-size:13px;color:var(--ink)}.chip.nopos{border-style:dashed;opacity:.8}
.note{font-size:12px;color:var(--muted);margin:10px 0 0}.err{color:#c0392b;font-size:13px;margin-top:8px}
.pin{padding:5px 10px;border-radius:10px;background:#fff;font-weight:800;font-size:12px;box-shadow:0 3px 10px #2a3f6a40;white-space:nowrap}
.hl{padding:3px 8px;border-radius:8px;color:#fff;font-weight:800;font-size:12px;box-shadow:0 2px 8px #0003}
.car{width:34px;height:34px;border-radius:50%;background:#fff;border:4px solid var(--red);box-shadow:0 3px 10px #0004;display:grid;place-items:center}
.bub{width:34px;height:34px;border-radius:50%;background:#ffd23f;border:3px solid #fff;box-shadow:0 3px 10px #0004;display:grid;place-items:center;transition:transform .3s}
.toast{position:absolute;right:18px;bottom:24px;background:#fff;border-radius:14px;padding:10px 14px;font-size:13px;max-width:290px;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px #2a3f6a30;z-index:3}.toast.show{opacity:1}
@media(max-width:760px){.panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;max-height:55%;padding:14px}.top{top:10px}.sub{display:none}}
html:lang(km) body{line-height:1.7}html:lang(km) .turn h2,html:lang(km) .st,html:lang(km) .pin,html:lang(km) .hl,html:lang(km) .chip,html:lang(km) .btn,html:lang(km) .top button{line-height:1.7}.top i{width:1px;background:var(--line);margin:6px 4px}
.nm{font-size:12px;font-weight:700;color:#34425c;white-space:nowrap;line-height:1.6;pointer-events:none;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff,0 0 6px #fff}.nm.road{color:#6b5a3e;font-size:11px}.nm.water{color:#2f7fa3;font-style:italic}.nm.place{font-size:15px;color:#1f2b45;letter-spacing:.02em}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 60%,#2a3f6a24 100%)}.panel{overflow-wrap:anywhere;text-rendering:optimizeLegibility;font-feature-settings:"kern","liga","ccmp","locl"}html:lang(km) body{font-size:16px}html:lang(km) h1{font-size:23px}html:lang(km) .nm{font-size:13.5px;line-height:1.8}html:lang(km) .turn h2{font-size:19px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* --- Miniature Phnom Penh visual upgrade: varied pastel architecture --- */
:root{
  --ink:#263449;--muted:#718096;--red:#ed5148;--card:rgba(255,253,247,.94);
  --line:#e7e1d5;--gold:#e7b95c;--green:#6f9d68
}
body{background:#cfe6f5}
.top{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #ffffffb8;box-shadow:0 10px 30px #26344924}
.top button{transition:background .22s ease,transform .22s ease}
.top button:hover{transform:translateY(-1px)}
.top button.on{background:linear-gradient(135deg,#f36b5d,#df443f);box-shadow:0 3px 10px #df443f45}
.panel{background:linear-gradient(155deg,rgba(255,254,250,.97),rgba(250,247,237,.93));border:1px solid #ffffffc9;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 18px 48px #27384b2b,0 2px 8px #27384b12}
h1{letter-spacing:-.025em;color:#27384b}
.sub{color:#718096}
.turn{background:linear-gradient(125deg,#fff2ce,#fff8e7);border:1px solid #f1d68c;box-shadow:inset 0 1px #fff}
.turn svg{box-shadow:0 3px 10px #9a6b2720}
.prog{height:9px;background:#e9e5db;box-shadow:inset 0 1px 2px #0000000d}
.prog i{background:linear-gradient(90deg,#f07b58,#e94343 70%,#d93643);box-shadow:0 0 12px #e9434360}
.btn{border:1px solid #e5dfd2;background:#fffefa;box-shadow:0 2px 5px #2634490b;transition:transform .2s,box-shadow .2s,background .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 7px 16px #26344916}
.btn.p{background:linear-gradient(135deg,#f16d5d,#df443f);border-color:#df443f;box-shadow:0 5px 14px #df443f35}
.chip{border-width:1px;background:linear-gradient(145deg,#fff,#faf8f1);box-shadow:0 2px 5px #2634490b;transition:transform .18s,box-shadow .18s}
.chip:hover{transform:translateY(-2px);box-shadow:0 5px 12px #26344916}
.pin{border:1px solid #fff;box-shadow:0 5px 15px #26344935;border-radius:12px}
.car{box-shadow:0 4px 14px #26344955;animation:carBob 1.6s ease-in-out infinite}
.bub{box-shadow:0 5px 16px #26344942}
.toast{border:1px solid #fff;backdrop-filter:blur(12px)}
.nm{padding:1px 5px;border-radius:5px;background:#fff9;backdrop-filter:blur(3px);text-shadow:0 1px 2px #fff,0 0 5px #fff}
.nm.place{padding:3px 8px;border:1px solid #fff;background:#fffdf2e8;border-radius:8px;box-shadow:0 3px 10px #2634491a}
.vig{background:radial-gradient(ellipse at center,transparent 64%,#31475c12 100%)}
@keyframes carBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@media(max-width:760px){
 .panel{border-radius:20px;box-shadow:0 12px 35px #26344930}
 .top{padding:4px}
 .top button{padding:8px 13px}
}
@media(prefers-reduced-motion:reduce){.car{animation:none}}


/* Destination marker treatment */
.pin:last-of-type{background:linear-gradient(135deg,#fff8df,#fff);color:#a94b35}

   map.addLayer({id:'pastel-building-footprints',type:'fill',source:buildingSource,
    'source-layer':'building',minzoom:12,
    paint:{'fill-color':pastel,'fill-outline-color':'#ffffff','fill-opacity':1}},firstSymbol);
  }catch(e){console.warn('Pastel building footprints unavailable',e)}
  // Pastel 3D walls, windows and roofs. This is the layer that previously kept the brown tones.
  try{
   const src=map.getStyle().layers.find(l=>l['source-layer']==='building')?.source||'openmaptiles',
    before=map.getStyle().layers.find(l=>l.type==='symbol')?.id,
    h=['coalesce',['get','render_height'],6],mh=['coalesce',['get','render_min_height'],0],top=['-',h,.8],
    ok=['!=',['get','hide_3d'],true],gr=['==',mh,0],
    v=['%',['floor',['+',['*',['coalesce',['to-number',['id']],0],7],['*',h,13]]],7],
    walls=['match',v,0,'#f28b72',1,'#65c7ad',2,'#65aee8',3,'#e88bb5',4,'#f2c65f',5,'#a994df','#83c98b'],
    glass=['match',v,0,'#285c83',1,'#246c70',2,'#285c83',3,'#754767',4,'#80632b',5,'#51467d','#356b4b'],
    add=(id,filter,paint)=>map.addLayer({id,type:'fill-extrusion',source:src,'source-layer':'building',
     minzoom:13,filter,paint:{'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':true,...paint}},before),
    P=3.2,F=3.4,N=6,band=(id,a,b,col)=>add(id,['all',ok,gr,['>',top,a]],
     {'fill-extrusion-color':col,'fill-extrusion-height':['min',b,top],'fill-extrusion-base':a});
   add('bld-base',['all',ok,gr],{'fill-extrusion-color':walls,'fill-extrusion-height':['min',P,top],'fill-extrusion-base':0});
   band('bld-w0',P,P+.9,walls);
   for(let k=0;k<N;k++){const a=P+k*F;band('bld-g'+k,a+.9,a+2.4,glass);band('bld-w'+(k+1),a+2.4,a+F+.9,walls)}
   band('bld-top',P+N*F+.9,1000,'#f4d68b');
   add('bld-part',['all',ok,['!',gr]],{'fill-extrusion-color':walls,'fill-extrusion-height':top,'fill-extrusion-base':mh});
   add('bld-roof',['all',ok],{'fill-extrusion-color':['case',['<',h,12],'#f6c39d','#b9c9d5'],
    'fill-extrusion-height':h,'fill-extrusion-base':top});
   for(const[id,col,w0,w1]of[['bridge-case','#cbd9e0',7,22],['bridge-deck','#fffdf7',4,16]])
    map.addLayer({id,type:'line',source:src,'source-layer':'transportation',minzoom:13,
     filter:['==',['get','brunnel'],'bridge'],layout:{'line-cap':'butt'},
     paint:{'line-color':col,'line-width':['interpolate',['linear'],['zoom'],13,w0/2,17,w1]}},before);
  }catch(e){console.warn('3D pastel buildings unavailable',e)}
  try{map.setLight({anchor:'viewport',color:'#fff7e8',intensity:.85,position:[1.3,220,55]})}catch(e){}
  try{map.setSky({'sky-color':'#8fd4f2','horizon-color':'#d9eff2','fog-color':'#d9eff2','sky-horizon-blend':.6,'horizon-fog-blend':.6,'fog-ground-blend':.4})}catch(e){}
  try{layer=makeLayer();map.addLayer(layer)}catch(e){layer=null;console.warn('Props unavailable',e)}
  map.once('idle',()=>layer&&plantParks());setInterval(detail,900);setInterval(labels,1500);map.on('idle',labels);load();
 });
 $('#le').onclick=()=>setLang('en');$('#lk').onclick=()=>setLang('km');
 function setLang(l){lang=l;try{localStorage.setItem('lang',l)}catch(_){}refresh()}
 refresh();
})();
