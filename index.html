<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Route Journey · Wat Phnom → Khmer Expo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;800&family=Noto+Sans+Khmer:wght@400;600;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--mu:#6b7480;--teal:#3cc6c6;--teal2:#1f8f94;--navy:#1f2f5c;--gold:#f2b705;--bg:#f4f6f8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font:500 14px/1.5 "Poppins","Noto Sans Khmer",system-ui,sans-serif;-webkit-text-size-adjust:100%}
html:lang(km) body{line-height:1.8}
#map{position:absolute;inset:0;height:100%}
.top{position:absolute;z-index:6;top:calc(12px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));display:flex;gap:4px;padding:4px;border-radius:999px;background:#fff;box-shadow:0 6px 20px #1c2a3a22}
.top button{min-width:46px;min-height:40px;border:0;border-radius:999px;background:none;font:inherit;font-weight:600;color:var(--mu);cursor:pointer}
.top button.on{background:var(--navy);color:#fff}
.panel{position:absolute;z-index:5;left:calc(18px + env(safe-area-inset-left));top:calc(18px + env(safe-area-inset-top));width:min(380px,calc(100% - 36px));max-height:calc(100dvh - 36px);overflow:auto;overscroll-behavior:contain;padding:22px;border-radius:28px;background:#fffffff2;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 50px #1c2a3a26,0 2px 6px #1c2a3a10}
body.film .panel{display:none}
.eye{font-size:12px;letter-spacing:.28em;font-weight:500;color:#333;text-transform:uppercase}
h1{margin:4px 0 14px;font-size:38px;line-height:1.02;font-weight:800;letter-spacing:-.03em}
html:lang(km) h1{font-size:30px;line-height:1.3}
.turn{display:flex;gap:12px;align-items:center;padding:12px;border-radius:20px;background:#eefafa}
.turn svg{width:48px;height:48px;flex:none;padding:11px;border-radius:50%;background:var(--teal);transition:transform .35s}
.d{font-size:12px;color:var(--teal2);font-weight:600}.turn h2{margin:0;font-size:17px;line-height:1.25;font-weight:600}.st{font-size:12px;color:var(--mu)}
.prog{margin:14px 0 4px;height:8px;border-radius:8px;background:#e3e8ee;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--teal2));border-radius:8px}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--mu)}.meta b{color:var(--ink)}
.row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;min-height:46px;border:0;border-radius:16px;padding:8px 6px;font:inherit;font-weight:600;color:var(--ink);background:#eef1f5;cursor:pointer;transition:transform .15s,background .15s}
.btn:hover:not(:disabled){background:#e3e8ee}.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.45}.btn.p{flex:1.4;background:var(--navy);color:#fff}.btn.f{background:var(--teal);color:#06383b}
.btn:focus-visible,.top button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.note{margin:12px 0 0;font-size:11px;color:var(--mu)}.err{color:#d33;font-size:13px;margin-top:8px}
.cap{position:absolute;z-index:4;left:50%;bottom:calc(26px + env(safe-area-inset-bottom));transform:translateX(-50%);max-width:90vw;text-align:center;padding:10px 24px;border-radius:999px;background:#fff;box-shadow:0 10px 30px #1c2a3a30;font-size:18px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none}
.cap.on{opacity:1}
/* callout cards with dotted leader, like the infographic */
.call{display:flex;flex-direction:column;align-items:center;width:150px;text-align:center;pointer-events:none}
.call h4{margin:0;font-size:15px;font-weight:800;color:var(--ink);text-shadow:0 0 6px #fff,0 0 6px #fff}
.call p{margin:1px 0 0;font-size:10.5px;line-height:1.35;color:#444;text-shadow:0 0 5px #fff,0 0 5px #fff}
.call i{display:block;width:0;height:34px;margin-top:5px;border-left:2px dotted var(--teal2);position:relative}
.call i:after{content:"";position:absolute;left:-5px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:var(--teal2)}
.call.e h4{color:#b8860b}
.car{width:42px;height:42px;filter:drop-shadow(0 6px 5px #1c2a3a40)}
.bub{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#fff;box-shadow:0 4px 12px #1c2a3a33}
.toast{position:absolute;z-index:7;right:16px;bottom:24px;max-width:290px;padding:10px 14px;border-radius:14px;background:#fff;box-shadow:0 8px 24px #1c2a3a30;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none}.toast.show{opacity:1}
.maplibregl-ctrl-attrib{font-size:10px}
@media(max-width:760px){
 .panel{left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));top:auto;bottom:calc(8px + env(safe-area-inset-bottom));width:auto;max-height:42dvh;padding:14px;border-radius:24px}
 h1{font-size:26px;margin-bottom:8px}html:lang(km) h1{font-size:22px}.eye{font-size:10px}.note{display:none}
 .turn{padding:9px;gap:9px}.turn svg{width:40px;height:40px;padding:9px}.turn h2{font-size:15px}.row{margin-top:8px}
 .cap{font-size:15px;bottom:calc(44dvh + 8px)}.toast{left:10px;right:10px;max-width:none;bottom:calc(44dvh + 8px)}
 .maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:42dvh}
 .call{width:120px}.call h4{font-size:13px}.call p{display:none}
}
@media(max-height:500px) and (orientation:landscape){
 .panel{top:calc(8px + env(safe-area-inset-top));bottom:8px;left:calc(8px + env(safe-area-inset-left));right:auto;width:min(46vw,340px);max-height:none;padding:14px}
 h1{font-size:24px}.maplibregl-ctrl-bottom-left,.maplibregl-ctrl-bottom-right{bottom:0}.cap{bottom:12px}
}
@media(max-width:380px){.btn{font-size:13px}}
</style>
</head>
<body>
<div id="map" aria-label="Isometric 3D route from Wat Phnom to Khmer Expo"></div>
<div class="cap" id="cap"></div>
<div class="top" role="group" aria-label="Language"><button id="le" class="on">EN</button><button id="lk" lang="km">ខ្មែរ</button></div>
<main class="panel">
 <div class="eye" data-k="eye"></div><h1 data-k="h1"></h1>
 <div class="turn" aria-live="polite">
  <svg id="arrow" viewBox="0 0 24 24" fill="none" stroke="#06383b" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20V5M6 11l6-6 6 6"/></svg>
  <div><div class="d" id="dist"></div><h2 id="instr"></h2><div class="st" id="street"></div></div>
 </div>
 <div class="prog"><i id="bar"></i></div>
 <div class="meta"><span id="remain"></span><span id="eta"></span></div>
 <div class="row"><button class="btn f" id="film" disabled></button><button class="btn p" id="start" disabled></button></div>
 <div class="row"><button class="btn" id="restart" disabled data-k="restart"></button><button class="btn" id="fit" disabled data-k="fit"></button></div>
 <div class="err" id="err"></div>
 <p class="note" data-k="note"></p>
</main>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.6.2/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script>
(()=>{
 // GOOGLE MAPS MIGRATION: paste a restricted Maps JavaScript API key when ready.
 const GOOGLE_MAPS_API_KEY='PASTE_YOUR_GOOGLE_MAPS_API_KEY_HERE';
 const START=[104.92306,11.57611],END=[104.94117,11.55235];
 const $=s=>document.querySelector(s),mobile=()=>innerWidth<760;
 const D={en:{eye:"Route",h1:"Career Journey".replace("Career Journey","Route Journey"),loading:"Loading route",conn:"Connecting to road router…",start:"▶ Drive",pause:"❚❚ Pause",resume:"▶ Resume",replay:"↻ Replay",film:"🎬 Film",restart:"Restart",fit:"Overview",note:"Route and time from OpenStreetMap + OSRM, no live traffic. Buildings are stylized.",byRoad:"by road",left:"left",eta:"about {n} min",now:"Now",in:"In {d}",km:"{n} km",m:"{n} m",c0:"Wat Phnom",c0d:"Start at the city's famous hilltop landmark",c1:"Checkpoint 1",c2:"Checkpoint 2",cd:"{d} from the start",c3:"Khmer Expo",c3d:"Diamond Island Convention & Exhibition Center",head:"Head out",headOn:"Head out on {r}",cont:"Continue straight",contOn:"Continue on {r}",arriving:"Arriving at Khmer Expo",bridge:"Cross the bridge",onto:"{a} onto {r}",round:"Roundabout, exit {n}",roundN:"At the roundabout",left_:"Turn left",right_:"Turn right",sl:"Bear left",sr:"Bear right",sharpl:"Sharp left",sharpr:"Sharp right",u:"Make a U-turn",arrived:"Arrived",arrivedMsg:"You have arrived at Khmer Expo",venue:"Diamond Island Convention & Exhibition Center",errT:"Route unavailable",err:"The router did not respond. Check your connection and reload. Directions are never guessed.",s:["Start · Wat Phnom","Into the city","Cruising along","Almost there","Arrived · Khmer Expo"]},
 km:{eye:"ផ្លូវ",h1:"ដំណើរទៅខ្មែរអិចស្ប៉ូ",loading:"កំពុងផ្ទុកផ្លូវ",conn:"កំពុងភ្ជាប់ប្រព័ន្ធរកផ្លូវ…",start:"▶ ធ្វើដំណើរ",pause:"❚❚ ផ្អាក",resume:"▶ បន្ត",replay:"↻ ចាក់ឡើងវិញ",film:"🎬 វីដេអូ",restart:"ចាប់ផ្តើមឡើងវិញ",fit:"ទិដ្ឋភាពទូទៅ",note:"ផ្លូវ និងរយៈពេល ពី OpenStreetMap និង OSRM មិនគិតចរាចរណ៍ផ្ទាល់។ អគារជាបែបគំនូរ។",byRoad:"តាមផ្លូវ",left:"នៅសល់",eta:"ប្រមាណ {n} នាទី",now:"ឥឡូវនេះ",in:"ក្នុងរយៈ {d}",km:"{n} គ.ម",m:"{n} ម៉ែត្រ",c0:"វត្តភ្នំ",c0d:"ចាប់ផ្តើមពីទីសម្គាល់ដ៏ល្បីនៃទីក្រុង",c1:"ចំណុចទី ១",c2:"ចំណុចទី ២",cd:"{d} ពីចំណុចចាប់ផ្តើម",c3:"ខ្មែរអិចស្ប៉ូ",c3d:"មជ្ឈមណ្ឌលសន្និបាត និងពិព័រណ៍កោះពេជ្រ",head:"ចាប់ផ្តើមធ្វើដំណើរ",headOn:"ចាប់ផ្តើមតាម {r}",cont:"បន្តទៅមុខត្រង់",contOn:"បន្តតាម {r}",arriving:"កំពុងមកដល់ខ្មែរអិចស្ប៉ូ",bridge:"ឆ្លងកាត់ស្ពាន",onto:"{a} ចូល {r}",round:"រង្វង់មូល ចេញទី {n}",roundN:"នៅរង្វង់មូល",left_:"បត់ឆ្វេង",right_:"បត់ស្តាំ",sl:"ងាកឆ្វេងបន្តិច",sr:"ងាកស្តាំបន្តិច",sharpl:"បត់ឆ្វេងខ្លាំង",sharpr:"បត់ស្តាំខ្លាំង",u:"បត់ត្រឡប់ក្រោយ",arrived:"បានមកដល់",arrivedMsg:"អ្នកបានមកដល់ខ្មែរអិចស្ប៉ូហើយ",venue:"មជ្ឈមណ្ឌលសន្និបាត និងពិព័រណ៍កោះពេជ្រ",errT:"មិនអាចរកផ្លូវបាន",err:"ប្រព័ន្ធរកផ្លូវមិនឆ្លើយតប។ សូមពិនិត្យអ៊ីនធឺណិត រួចផ្ទុកឡើងវិញ។",s:["ចាប់ផ្តើម · វត្តភ្នំ","ចូលទីក្រុង","បើកបរតាមផ្លូវ","ជិតដល់ហើយ","មកដល់ · ខ្មែរអិចស្ប៉ូ"]}};
 let lang=(new URLSearchParams(location.search).get('lang')||(navigator.language||'').slice(0,2))==='km'?'km':'en';
 let coords=[],cum=[],total=0,steps=[],stepAt=[],stepLoc=[],vehicle,bub,tw,orb,hdg=0,endPt=END,etaMin=0,arrived=false,failed=false,btn='start',curI=0,filmMode=false,sc=-1,calls=[];
 const st={m:0},rad=x=>x*Math.PI/180;
 const t=(k,v)=>{let x=D[lang][k]??D.en[k];for(const y in v)x=x.replace('{'+y+'}',v[y]);return x};
 const nm=x=>lang==='km'?String(x).replace(/\d/g,d=>'០១២៣៤៥៦៧៨៩'[d]):String(x);
 const km=m=>m>=1000?t('km',{n:nm((m/1000).toFixed(1))}):t('m',{n:nm(Math.round(m/10)*10)});
 const dist=(a,b)=>{const dl=rad(b[0]-a[0]),dp=rad(b[1]-a[1]),q=Math.sin(dp/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dl/2)**2;return 12742000*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))};
 const brg=(a,b)=>{const y=Math.sin(rad(b[0]-a[0]))*Math.cos(rad(b[1])),x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[0]-a[0]));return(Math.atan2(y,x)*180/Math.PI+360)%360};
 const idx=m=>{let i=1;while(i<cum.length-1&&cum[i]<m)i++;return i};
 const at=m=>{const i=idx(m),f=Math.min(1,Math.max(0,(m-cum[i-1])/(cum[i]-cum[i-1]||1))),a=coords[i-1],b=coords[i];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]};
 const partial=m=>{const c=coords.slice(0,idx(m));c.push(at(m));return{type:'Feature',geometry:{type:'LineString',coordinates:c}}};
 const caption=i=>{const e=$('#cap');if(i<0){e.classList.remove('on');return}e.textContent=t('s')[i];e.classList.add('on');clearTimeout(caption.h);caption.h=setTimeout(()=>e.classList.remove('on'),3000)};
 const pad=()=>mobile()?{top:90,bottom:Math.round(innerHeight*.48),left:50,right:50}:{top:110,bottom:80,left:440,right:90};
 const camPad=()=>filmMode?{left:0,bottom:0,top:0,right:0}:mobile()?{bottom:Math.round(innerHeight*.28),top:0,left:0,right:0}:{left:390,top:0,bottom:0,right:0};
 const ANG={straight:0,'slight right':30,right:90,'sharp right':140,uturn:180,'sharp left':-140,left:-90,'slight left':-30};
 const MODT={left:'left_',right:'right_','slight left':'sl','slight right':'sr','sharp left':'sharpl','sharp right':'sharpr',uturn:'u'};
 function describe(s){const m=s.maneuver,tp=m.type,mod=(m.modifier||'straight').replace('_',' '),rd=s.name||'',on=x=>rd?t('onto',{a:x,r:rd}):x,a=ANG[mod]||0;
  if(/bridge|pont|ស្ពាន/i.test(rd))return[a,t('bridge')];
  if(tp==='depart')return[0,rd?t('headOn',{r:rd}):t('head')];
  if(tp==='arrive')return[null,t('arriving')];

  if(MODT[mod]&&/turn|end of road|fork|ramp|merge|new name|continue/.test(tp))return[a,on(t(MODT[mod]))];
  return[0,rd?t('contOn',{r:rd}):t('cont')];}
 const ARW='<path d="M12 20V5M6 11l6-6 6 6"/>';
 function show(i,m){const[deg,txt]=describe(steps[i]),a=$('#arrow');a.innerHTML=deg===null?'<circle cx="12" cy="12" r="5"/>':ARW;a.style.transform=`rotate(${deg||0}deg)`;const r=Math.max(0,stepAt[i]-m);curI=i;
  $('#dist').textContent=r<25?t('now'):t('in',{d:km(r)});$('#instr').textContent=txt;$('#street').textContent=steps[i].name||'';
  if(bub){bub.setLngLat(stepLoc[i]);bub.getElement().innerHTML=`<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#1f8f94" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" style="transform:rotate(${deg||0}deg)">${deg===null?'<circle cx="12" cy="12" r="5"/>':ARW}</svg>`}}
 const remainHTML=l=>l===undefined?`<b>${km(total)}</b> ${t('byRoad')}`:`<b>${km(l)}</b> ${t('left')}`;
 const callHTML=c=>`<h4>${t(c.h)}</h4><p>${c.d?t(c.d,{d:km(c.m||0)}):''}</p><i></i>`;
 function refresh(){
  document.documentElement.lang=lang;document.title='Route Journey · '+t('c0')+' → '+t('c3');
  document.querySelectorAll('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));
  $('#le').classList.toggle('on',lang==='en');$('#lk').classList.toggle('on',lang==='km');
  calls.forEach(c=>c.el.innerHTML=callHTML(c));
  $('#start').textContent=t(btn);$('#film').textContent=t('film');$('#err').textContent=failed?t('err'):'';

  else{$('#eta').textContent=t('eta',{n:nm(etaMin)});
   if(arrived){$('#dist').textContent=t('arrived');$('#instr').textContent=t('arrivedMsg');$('#street').textContent=t('venue');$('#remain').innerHTML=remainHTML(0)}
   else{show(curI,st.m);$('#remain').innerHTML=remainHTML(st.m>0?total-st.m:undefined)}}}

 const map=new maplibregl.Map({container:'map',style:'https://tiles.openfreemap.org/styles/positron',center:START,zoom:14,pitch:55,bearing:-25,maxPitch:75,attributionControl:{compact:true}});

 function paint(){
  for(const l of map.getStyle().layers){try{
   const id=l.id.toLowerCase(),sl=(l['source-layer']||'').toLowerCase();
   if(l.type==='background')map.setPaintProperty(l.id,'background-color','#f4f6f8');
   else if(l.type==='fill'&&sl==='water')map.setPaintProperty(l.id,'fill-color','#cdeff0');
   else if(l.type==='fill'&&(sl==='park'||/park|wood|grass|forest|garden/.test(id)))map.setPaintProperty(l.id,'fill-color','#8fc973');
   else if(l.type==='fill'&&sl==='landcover')map.setPaintProperty(l.id,'fill-color',['match',['get','class'],'wood','#9bd07f','grass','#b4dd98','#eef1f3']);
   else if(l.type==='fill'&&sl==='landuse')map.setPaintProperty(l.id,'fill-color',['match',['get','class'],'park','#8fc973','cemetery','#d7e6cf','#eceff2']);
   else if(l.type==='line'&&sl==='transportation'){const c=/case|casing/.test(id);map.setPaintProperty(l.id,'line-color',c?'#dde2e8':'#ffffff')}
   else if(l.type==='line'&&sl==='waterway')map.setPaintProperty(l.id,'line-color','#b5e4e6');
   else if(l.type==='symbol'){map.setPaintProperty(l.id,'text-color','#4a5563');map.setPaintProperty(l.id,'text-halo-color','#ffffff');map.setPaintProperty(l.id,'text-halo-width',1.8)}
   else if(sl==='building'&&(l.type==='fill'||l.type==='fill-extrusion'))map.setLayoutProperty(l.id,'visibility','none');
  }catch(e){}}
  try{ // white towers with blue glass bands, grey roofs, navy accents
   const src=map.getStyle().layers.find(l=>l['source-layer']==='building')?.source||'openmaptiles',
   before=map.getStyle().layers.find(l=>l.type==='symbol')?.id,
   h=['coalesce',['get','render_height'],6],mh=['coalesce',['get','render_min_height'],0],top=['-',h,.9],
   ok=['!=',['get','hide_3d'],true],gr=['==',mh,0],v=['%',['floor',['*',h,7]],7],
   wall=['match',v,6,'#1f2f5c',0,'#f7f8fa',1,'#eceff3','#ffffff'],
   add=(id,filter,paint)=>map.addLayer({id,type:'fill-extrusion',source:src,'source-layer':'building',minzoom:13,filter,paint:{'fill-extrusion-opacity':1,'fill-extrusion-vertical-gradient':true,...paint}},before),
   band=(id,a,b,col)=>add(id,['all',ok,gr,['>',top,a]],{'fill-extrusion-color':col,'fill-extrusion-height':['min',b,top],'fill-extrusion-base':a}),
   P=3,F=3.4,N=7;
   add('b-base',['all',ok,gr],{'fill-extrusion-color':wall,'fill-extrusion-height':['min',P,top],'fill-extrusion-base':0});
   for(let k=0;k<N;k++){const a=P+k*F;band('b-g'+k,a,a+2.2,['match',v,6,'#4a6fb0','#4f93c9']);band('b-w'+k,a+2.2,a+F,wall)}
   band('b-top',P+N*F,1000,wall);
   add('b-part',['all',ok,['!',gr]],{'fill-extrusion-color':wall,'fill-extrusion-height':top,'fill-extrusion-base':mh});
   add('b-roof',['all',ok],{'fill-extrusion-color':'#cfd6de','fill-extrusion-height':h,'fill-extrusion-base':top});
  }catch(e){console.warn('Buildings',e)}
  try{map.setLight({anchor:'viewport',color:'#ffffff',intensity:.5,position:[1.2,210,45]})}catch(e){}
  try{map.setSky({'sky-color':'#eaf2f7','horizon-color':'#ffffff','fog-color':'#f4f6f8','sky-horizon-blend':.5,'horizon-fog-blend':.7,'fog-ground-blend':.5})}catch(e){}
 }
 function callout(ll,h,d,m,cls){const el=Object.assign(document.createElement('div'),{className:'call '+(cls||'')}),c={el,h,d,m};el.innerHTML=callHTML(c);calls.push(c);return new maplibregl.Marker({element:el,anchor:'bottom',offset:[0,6]}).setLngLat(ll).addTo(map)}

 async function load(){
  try{
   const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${START.join(',')};${END.join(',')}?steps=true&overview=full&geometries=geojson`);
   if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(d.code!=='Ok'||!d.routes.length)throw Error(d.code);
   const rt=d.routes[0];coords=rt.geometry.coordinates;steps=rt.legs.flatMap(l=>l.steps);endPt=d.waypoints[1].location;
   cum=[0];for(let i=1;i<coords.length;i++)cum[i]=cum[i-1]+dist(coords[i-1],coords[i]);total=cum.at(-1);
   let k=0;for(const s of steps){const p=s.maneuver.location;let best=k,bd=1e9;for(let j=k;j<Math.min(coords.length,k+600);j++){const e=dist(p,coords[j]);if(e<bd){bd=e;best=j}}k=best;stepAt.push(cum[best]);stepLoc.push(coords[best])}
   const before=map.getStyle().layers.find(l=>l.type==='symbol')?.id,L={'line-cap':'round','line-join':'round'},
   ribbon=(src,pre,top,side)=>{
    map.addLayer({id:pre+'sh',type:'line',source:src,layout:L,paint:{'line-color':'#1c3a4a','line-width':26,'line-blur':10,'line-opacity':.22,'line-translate':[10,18]}},before);
    map.addLayer({id:pre+'sd',type:'line',source:src,layout:L,paint:{'line-color':side,'line-width':24,'line-translate':[0,7]}},before);
    map.addLayer({id:pre+'tp',type:'line',source:src,layout:L,paint:{'line-color':top,'line-width':24}},before)};
   map.addSource('route',{type:'geojson',data:{type:'Feature',geometry:{type:'LineString',coordinates:coords}}});
   map.addSource('done',{type:'geojson',data:partial(1)});
   ribbon('route','r','#3cc6c6','#1f8f94');
   map.addLayer({id:'rdash',type:'line',source:'route',layout:L,paint:{'line-color':'#ffffff','line-width':2.5,'line-dasharray':[0,2.2,2.2],'line-opacity':.8}},before);
   ribbon('done','d','#f2b705','#b88300');
   callout(START,'c0','c0d');
   callout(at(total*.33),'c1','cd',total*.33);callout(at(total*.66),'c2','cd',total*.66);
   callout(endPt,'c3','c3d',0,'e');
   vehicle=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'car',innerHTML:'<svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="18" fill="#fff" stroke="#1f2f5c" stroke-width="3.5"/><path d="M21 8l9 22-9-5-9 5z" fill="#1f2f5c" stroke="#1f2f5c" stroke-width="2" stroke-linejoin="round"/></svg>'}),rotationAlignment:'viewport',pitchAlignment:'viewport'}).setLngLat(START).addTo(map);
   bub=new maplibregl.Marker({element:Object.assign(document.createElement('div'),{className:'bub'}),rotationAlignment:'viewport',pitchAlignment:'viewport',offset:[0,-32]}).setLngLat(stepLoc[0]).addTo(map);
   const dur=Math.max(24,Math.min(60,total/1000*5));
   tw=gsap.to(st,{m:total,duration:dur,ease:'power1.inOut',paused:true,onUpdate:()=>tick(st.m),onComplete:arrive});
   etaMin=Math.round(rt.duration/60);
   ['#start','#restart','#fit','#film'].forEach(s=>$(s).disabled=false);show(0,0);refresh();overview();
  }catch(e){console.error(e);failed=true;refresh()}
 }
 function tick(m){
  const pos=at(m),tg=brg(pos,at(Math.min(total,m+90)));hdg=(hdg+((tg-hdg+540)%360-180)*.07+360)%360;
  tick.c=tick.c?[tick.c[0]+(pos[0]-tick.c[0])*.3,tick.c[1]+(pos[1]-tick.c[1])*.3]:pos;
  const f=m/total,swing=filmMode?Math.sin(f*Math.PI*6)*24:0,zoom=filmMode?16+Math.sin(f*Math.PI*4)*.6:16.1,pitch=filmMode?62+Math.sin(f*Math.PI*3)*8:58;
  map.jumpTo({center:tick.c,bearing:hdg+swing,pitch,zoom,padding:camPad()});
  vehicle.setLngLat(pos);map.getSource('done').setData(partial(m));
  $('#bar').style.width=f*100+'%';$('#remain').innerHTML=remainHTML(total-m);
  let i=0;while(i<steps.length-1&&stepAt[i]<m+8)i++;show(i,m);
  if(filmMode){const s=f<.04?0:f<.3?1:f<.55?2:f<.8?3:4;if(s!==sc){sc=s;caption(s)}}
 }
 const stopOrbit=()=>{orb&&orb.kill();orb=null};
 function arrive(){arrived=true;btn='replay';refresh();
  map.easeTo({center:endPt,zoom:17.2,pitch:60,padding:{left:0,bottom:0,top:0,right:0},duration:2200});
  const o={b:hdg};orb=gsap.to(o,{b:hdg+360,duration:9,ease:'power1.inOut',delay:2.3,onUpdate:()=>map.setBearing(o.b),onComplete:()=>{orb=null}});
  if(filmMode){caption(4);setTimeout(()=>{filmMode=false;document.body.classList.remove('film')},5000)}}
 function overview(){if(!coords.length)return;tw&&tw.pause();stopOrbit();filmMode=false;document.body.classList.remove('film');
  map.setPadding({top:0,bottom:0,left:0,right:0});
  map.fitBounds(coords.reduce((b,p)=>b.extend(p),new maplibregl.LngLatBounds(coords[0],coords[0])),{padding:pad(),duration:1300,maxZoom:15,pitch:55,bearing:-25});
  btn=st.m>0&&st.m<total?'resume':'start';$('#start').textContent=t(btn)}
 function play(){if(!tw)return;stopOrbit();if(tw.progress()>=1)tw.progress(0);map.stop();btn='pause';$('#start').textContent=t(btn);tw.play()}
 function reset(){stopOrbit();tw.pause(0);st.m=0;hdg=0;tick.c=null;sc=-1;$('#bar').style.width='0';arrived=false;vehicle.setLngLat(START);map.getSource('done').setData(partial(1));show(0,0);filmMode=false;document.body.classList.remove('film');overview();btn='start';refresh()}
 function film(){reset();filmMode=true;document.body.classList.add('film');caption(0);
  map.flyTo({center:START,zoom:15.6,pitch:68,bearing:-60,duration:2400,essential:true});
  setTimeout(()=>{if(filmMode)play()},2600)}
 $('#start').onclick=()=>tw&&(tw.isActive()?(tw.pause(),btn='resume',$('#start').textContent=t(btn)):(arrived&&reset(),play()));
 $('#restart').onclick=reset;$('#fit').onclick=overview;$('#film').onclick=film;
 $('#le').onclick=()=>{lang='en';refresh()};$('#lk').onclick=()=>{lang='km';refresh()};
 addEventListener('resize',()=>map.resize());addEventListener('orientationchange',()=>setTimeout(()=>map.resize(),250));
 map.on('load',()=>{paint();load()});
 refresh();
})();
</script>
